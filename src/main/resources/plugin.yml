name: SHJoinItems
version: '${project.version}'
main: org.Cry_Legende.sHJoinItems.SHJoinItems
api-version: '1.21'
author: Cry_Legende
description: Items donnés à la connexion et kits par zone WorldGuard (remplace ItemJoin).
softdepend: [WorldGuard]

commands:
  shjoinitems:
    description: Gestion des items de connexion.
    usage: /<command> <reload|refresh [joueur]>
    aliases: [shji]

permissions:
  shjoinitems.admin:
    description: Toute l'administration de SHJoinItems.
    default: op
    children:
      shjoinitems.admin.reload: true
      shjoinitems.admin.refresh: true
  shjoinitems.admin.reload:
    description: Recharger la configuration et redonner les items (/shjoinitems reload).
    default: op
  shjoinitems.admin.refresh:
    description: Redonner ses items à un joueur (/shjoinitems refresh).
    default: op
